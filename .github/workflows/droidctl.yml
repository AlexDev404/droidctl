name: DroidCtl

# The Android host app added by this fork. Separate from release.yml so that
# scrcpy's own release pipeline is untouched.

on:
  push:
    paths:
      - 'droidctl/**'
      - 'server/**'
      - 'gradle/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/droidctl.yml'
  pull_request:
    paths:
      - 'droidctl/**'
      - 'server/**'
      - 'gradle/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/droidctl.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Also builds :server, since :droidctl bundles the server it produces.
      - name: Build
        run: ./gradlew :droidctl:assembleDebug :droidctl:assembleRelease

      # Uploaded before the tests and lint run, so a failing check still leaves
      # an installable build to reproduce the failure on real hardware with.
      # The job's own status still depends on those checks passing.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droidctl-debug-apk
          path: droidctl/build/outputs/apk/debug/droidctl-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Unsigned: `apksigner` (or `gradle` with a signing config) has to sign it
      # before a device will install it. The debug APK above is debug-signed and
      # installs as-is.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: droidctl-release-apk-unsigned
          path: droidctl/build/outputs/apk/release/droidctl-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests
        run: ./gradlew :droidctl:testDebugUnitTest

      - name: Lint
        run: ./gradlew :droidctl:lintDebug

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: droidctl-reports
          path: droidctl/build/reports/
          retention-days: 30
